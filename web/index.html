<!doctype html><html lang="ru"><meta charset="utf-8"><title>Library System — МДК 03.02</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17263a;font:16px Arial}header{background:#18334d;color:white;padding:22px 32px}header h1{margin:0;font-size:26px}header p{margin:8px 0 0;font-size:14px}nav{position:fixed;width:240px;top:104px;bottom:0;background:white;padding:16px;border-right:1px solid #ddd}nav button{display:block;text-align:left;width:100%;background:white;color:#28445f;margin:5px 0}nav button.active{background:#dceaf6;font-weight:bold}main{margin-left:240px;padding:26px}section{background:white;border:1px solid #dce3ea;padding:22px;border-radius:6px;margin:16px 0}button{border:0;border-radius:4px;background:#246a9d;color:white;padding:12px;cursor:pointer}h2{font-size:25px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid #dce3ea;text-align:left;padding:9px;vertical-align:top}th{background:#edf3f8}.summary{background:#e9f4ee;color:#145e36;padding:14px;margin:16px 0}input,select{padding:10px;margin:8px;border:1px solid #aebcc9}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.5}.bad{color:#a12e34}</style>
<header><h1>Library System</h1><p>Электронная библиотека · вариант 2 · МДК 03.02 · API NET 8</p></header><nav id="nav"></nav><main id="view"></main>
<script>
const titles=['Библиотека и загрузка','ПР 1 · Стандарты','ПР 2 · Гармонизация','ПР 3 · Аудит кода','ПР 4 · Метрики','ПР 5 · Качество','ПР 6 · Тестирование','ПР 7 · STRIDE','ПР 8 · Защита загрузки'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(heads,rows)=>'<table><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>';
const get=async name=>{let r=await fetch('/lab/data/'+name);if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
async function openView(n){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',n===i));let v=document.getElementById('view');v.innerHTML='<h2>'+titles[n]+'</h2><p>Загрузка…</p>';try{
if(n===0){v.innerHTML='<h2>Каталог и приём книг</h2><section><p>Загрузка только библиотекарем. Новые книги остаются в приватном карантине.</p><label>Учебная роль <select id="role" onchange="catalog()"><option>Librarian</option><option>Reader</option></select></label><input id="title" aria-label="Название" value="Учебная книга"><input type="file" id="file"><button onclick="uploadBook()">Загрузить книгу</button><p>Образцы: <a href="/lab/sample/pdf">PDF</a> · <a href="/lab/sample/epub">EPUB</a> · <a href="/lab/sample/zip-slip">Zip Slip</a></p><div id="uploadResult"></div></section><section><h3>Книги</h3><div id="catalog"></div></section>';await catalog();}
if(n===1){let d=await get('standards');v.innerHTML='<h2>Классификация стандартов</h2><section>'+table(['Стандарт','Категория','Применение','Приоритет'],d.map(x=>[x.standard,x.category,x.use,x.priority]))+'</section>';}
if(n===2){let d=await get('harmonization');v.innerHTML='<h2>Гармонизация требований</h2><section>'+table(['Область','ГОСТ / ЕСПД','ISO/IEC/IEEE 12207','Артефакт'],d.map(x=>[x.area,x.national,x.international,x.artifact]))+'</section>';}
if(n===3){let d=await get('analysis');v.innerHTML='<h2>Статический аудит Roslyn</h2><section>'+table(['Правило','Объект','Статус','Замечание'],d.beforeAudit.map(x=>[x.rule,x.location,x.status,x.description]))+'<div class="summary">После исправления UploadController: нарушений '+d.afterAudit.length+'</div></section>';}
if(n===4){let d=await get('analysis'),a=d.before.methods.find(x=>x.name==='upload'),b=d.after.methods.find(x=>x.name==='Upload');v.innerHTML='<h2>Метрики до и после рефакторинга</h2><section>'+table(['Метрика','До','После'],[['Строки метода',a.lines,b.lines],['Цикломатическая сложность',a.complexity,b.complexity],['Halstead Volume',a.volume,b.volume],['Maintainability Index',a.mi,b.mi],['AST-зависимости',d.before.coupling,d.after.coupling],['LCOM1',d.before.lcom1,d.after.lcom1]])+'<p>Одна методика подсчёта до и после. AST-зависимости не являются семантическим CBO.</p></section>';}
if(n===5){let d=await get('quality');v.innerHTML='<h2>Восемь характеристик качества</h2><section>'+table(['Характеристика','Балл / 5','Основание','Улучшение'],d.map(x=>[x.characteristic,x.score,x.evidence,x.improvement]))+'</section><p>ГОСТ Р ИСО/МЭК 25010-2015. Рабочая шкала проекта, не сертификация.</p>';}
if(n===6){let d=await get('tests');v.innerHTML='<h2>xUnit и FluentAssertions</h2><section>'+(d.tests?'<div class="summary">Всего '+d.total+' · Passed '+d.passed+' · Failed '+d.failed+' · Skipped '+d.skipped+'</div>'+table(['Случай xUnit','Результат'],d.tests.map(x=>[x.name,x.outcome])):esc(d.status))+'</section>';}
if(n===7){let d=await get('threats');v.innerHTML='<h2>Модель угроз STRIDE</h2><section>'+table(['Категория','Угроза','Узел','OWASP 2025','Защита'],d.map(x=>[x.category,x.threat,x.node,x.owasp,x.control]))+'</section>';}
if(n===8)v.innerHTML='<h2>Проверки безопасной загрузки</h2><section><p>Реальные HTTP-запросы к работающему API.</p><button id="run" onclick="runChecks()">Выполнить проверки API</button><div id="checks"></div></section>';
}catch(e){v.innerHTML='<p class="bad">'+esc(e.message)+'</p>';}}
const sessionTokens = new Map();
async function session(){let role=document.getElementById('role').value;if(!sessionTokens.has(role)){let r=await fetch('/lab/session/'+role);if(!r.ok)throw Error('HTTP '+r.status);sessionTokens.set(role,(await r.json()).token);}return sessionTokens.get(role);}
async function catalog(){let token=await session(),r=await fetch('/api/books',{headers:{Authorization:'Bearer '+token}}),d=await r.json();document.getElementById('catalog').innerHTML=table(['Название','Файл','Байт','Статус'],d.map(x=>[x.title,x.originalName,x.length,x.status]));}
async function uploadBook(){let token=await session(),f=document.getElementById('file').files[0];if(!f)return;let data=new FormData();data.append('title',document.getElementById('title').value);data.append('file',f);let r=await fetch('/api/books/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:data});document.getElementById('uploadResult').innerHTML='<p>HTTP '+r.status+'</p><pre>'+esc(await r.text())+'</pre>';await catalog();}
async function runChecks(){let b=document.getElementById('run');b.disabled=true;let c=document.getElementById('checks');c.textContent='Выполняются запросы…';try{let r=await fetch('/lab/scenarios',{method:'POST'}),d=await r.json();c.innerHTML='<div class="summary">Проверок '+d.length+' · Пройдено '+d.filter(x=>x.passed).length+' · Ошибок '+d.filter(x=>!x.passed).length+'</div>'+table(['Проверка','Ожидалось','Получено','Итог'],d.map(x=>[x.name,x.expected,x.actual,x.passed?'Пройдено':'Ошибка']));}catch(e){c.textContent=e.message}finally{b.disabled=false}}
document.getElementById('nav').innerHTML=titles.map((x,i)=>'<button onclick="openView('+i+')">'+x+'</button>').join('');openView(Number(location.hash.slice(1))||0);
</script></html>
